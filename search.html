<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">

<body data-page="search">

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">

  <script src="data-math.js"></script>
