<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><rect width="460" height="320" rx="12" fill="#fff"/><ellipse cx="126" cy="224" rx="68.0" ry="16.8" fill="none" stroke="#0891B2" stroke-width="2"/><ellipse cx="126" cy="140" rx="68.0" ry="16.8" fill="none" stroke="#0891B2" stroke-width="2"/><line x1="58" y1="224" x2="58" y2="140" stroke="#0891B2" stroke-width="2"/><line x1="194" y1="224" x2="194" y2="140" stroke="#0891B2" stroke-width="2"/><line x1="126" y1="224" x2="126" y2="140" stroke="#8794AB" stroke-width="1.3" stroke-dasharray="4 4"/><text x="132" y="184" font-size="12" fill="#8794AB" text-anchor="start">h=√3</text><line x1="126" y1="224" x2="194" y2="224" stroke="#E11D48" stroke-width="1.6"/><text x="140" y="240" font-size="12" fill="#E11D48" text-anchor="start">r=3</text><text x="126" y="100" font-size="13" fill="#101828" text-anchor="middle">圆柱侧面积 2πrh</text><ellipse cx="318" cy="224" rx="68.0" ry="16.8" fill="none" stroke="#2563EB" stroke-width="2"/><line x1="250" y1="224" x2="318" y2="108" stroke="#2563EB" stroke-width="2"/><line x1="386" y1="224" x2="318" y2="108" stroke="#2563EB" stroke-width="2"/><line x1="318" y1="224" x2="318" y2="108" stroke="#8794AB" stroke-width="1.3" stroke-dasharray="4 4"/><line x1="318" y1="108" x2="386" y2="224" stroke="#E11D48" stroke-width="1.8"/><text x="360" y="160" font-size="12" fill="#E11D48" text-anchor="start">l=√(r²+h²)=2√3</text><text x="318" y="80" font-size="13" fill="#101828" text-anchor="middle">圆锥侧面积 πrl</text><text x="230" y="270" font-size="13" fill="#2563EB" text-anchor="middle">侧面积相等：2πrh = πrl ⇒ 2h = l ⇒ r = 3</text></svg>